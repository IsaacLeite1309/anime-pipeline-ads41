services:
  mongo:
    image: mongo:8.0.16
    ports: ["127.0.0.1:27018:27017"]
    volumes: ["mongo-data:/data/db"]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  pipeline:
    build: .
    environment:
      MONGO_URI: mongodb://mongo:27017
    volumes: ["./data:/app/data"]
    depends_on:
      mongo:
        condition: service_healthy
volumes:
  mongo-data:
